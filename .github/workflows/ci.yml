on:
  push:
    branches: ["PROD"]
  pull_request:
    branches: ["PROD"]

jobs:
  ci:
    runs-on: self-hosted

    steps:
      # va chercher les fichiers du repo
      - name: Checkout
        uses: actions/checkout@v4

      # on install Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # install dependances du backend
      - name: Install backend deps
        run: |
          cd Backend
          npm install

      # verifie la qualite du push et le code
      - name: Lint backend
        run: |
          cd Backend
          npm run lint
      # lance les test pour les routes du backend
      - name: Run backend tests
        run: |
          cd Backend
          npm test

      # install deps du front
      - name: Install frontend deps
        run: |
          cd Frontend/techyourjob-frontend
          npm install

      # build le frontend
      - name: Build frontend
        run: |
          cd Frontend/techyourjob-frontend
          npm run build

      # lance le frontend en bg
      - name: Start frontend
        run: |
          cd Frontend/techyourjob-frontend
          npm start &
          sleep 10

      # audit Lighthouse
      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true
