services:

  # front
  frontend:
    build:
      context: ./Frontend/techyourjob-frontend/
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${PORT_FRONT}:3000"
    env_file:
      - .env

  # db
  db:
    image: postgres:15.3-alpine3.18
    restart: always
    container_name: db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '${PORT_DB}:5432'
    volumes: 
      - ./db:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  # logiciel indien
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PORT_PGADMIN}:80"
    depends_on:
      - db

  # service de mise a jour de la db avec du scrap
  scheduler:
    build: ./Data/Get_Data_API
    container_name: scheduler


    
  # backend
  backend:
    build: 
      context: ./Backend/
      dockerfile: Dockerfile
    container_name: backend
    environment:
      - PORT_BACK=${PORT_BACK}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - "${PORT_BACK}:5000"
    depends_on:
      - db
