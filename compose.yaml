services:

  # front
  frontend:
    build:
      context: ./Frontend/techyourjob-frontend/
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    env_file:
      - .env

  # db
  db:
    image: postgres:15.3-alpine3.18
    restart: always
    container_name: db
    environment:
      - POSTGRES_USER=${DBusername}
      - POSTGRES_PASSWORD=${DBMDP}
      - POSTGRES_DB=${DBname}
    ports:
      - '5432:5432'
    volumes: 
      - ./db:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  # logiciel indien
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=arialdetrax@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=JarodPutman60
    ports:
      - "5050:80"
    depends_on:
      - db
