services:
  # front
  frontend:
    build:
      context: ./Frontend/techyourjob-frontend/
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "${PORT_FRONT}:3000"
    volumes:
      - ./Frontend/techyourjob-frontend:/app
    env_file:
      - .env

  # db
  db:
    image: postgis/postgis:15-3.3
    restart: always
    container_name: db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Europe/Paris
      - PGTZ=Europe/Paris
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  # logiciel indien
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "${PORT_PGADMIN}:80"
    depends_on:
      - db

  # service de mise a jour de la db avec du scrap
  scheduler:
    build: ./Data/Get_Data_API
    container_name: scheduler

  # backend
  backend:
    build:
      context: ./Backend/
      dockerfile: Dockerfile
    container_name: backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PORT_BACK=${PORT_BACK}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "${PORT_BACK}:5000"
    volumes:
      - ./Backend:/usr/local/app
      - /usr/local/app/node_modules
    depends_on:
      - db
